<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#5b8fba" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="스펀지 바이블" />
    <link rel="icon" href="assets/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <link rel="manifest" href="manifest.json" />
    <title>스펀지 바이블 - 카드 보기</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/card.css" />
  </head>
  <body class="card-page">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-main">
        <div class="header-left">스펀지 바이블</div>
        <div class="header-center">
          <img src="assets/logo.png" alt="스펀지 바이블 로고" />
        </div>
        <div class="header-right">
          <button class="font-btn" id="fdn" title="글자 작게">가−</button>
          <button class="font-btn" id="fup" title="글자 크게">가+</button>
        </div>
      </div>
    </header>

    <!-- 로딩 -->
    <div id="loading">📖 성경 데이터 불러오는 중…</div>

    <!-- 앱 본문 -->
    <div id="app" class="card-app" style="display: none">
      <!-- 상단 컨트롤 바 (1줄 콤팩트) -->
      <div class="ctrl-wrap">
        <div class="ctrl-bar">
          <!-- 단계 버튼 + 목록 보기 -->
          <div class="stage-row">
            <button class="stage-btn on" data-s="0">전체 보기</button>
            <button class="stage-btn" data-s="1" title="명사 가리기">1단계</button>
            <button class="stage-btn" data-s="2" title="어구 가리기">2단계</button>
            <button class="stage-btn" data-s="3" title="전체 가리기">3단계</button>
            <a href="index.html" class="stage-btn mode-btn" title="목록 형태로 보기">📋 목록</a>
          </div>
          <!-- 2단계 선택 시에만 표시되는 어구 선택 바 -->
          <div class="phrase-row" id="phrase-row" style="display: none">
            <span class="phrase-tip">가릴 어구:</span>
            <button class="phrase-btn on" data-ps="1">1어절씩</button>
            <button class="phrase-btn" data-ps="2">2어절씩</button>
          </div>
        </div>
      </div>

      <!-- 카드 메인 영역 -->
      <main class="card-main">
        <div class="card-viewport" id="card-viewport">
          <div class="card-wrapper" id="card-wrapper">
            <!-- 자바스크립트로 현재 카드 렌더링 -->
          </div>
        </div>
      </main>

      <!-- 하단 컨트롤 바: [이전] — 슬라이더(1/100) — [다음] -->
      <!-- 하단 내비게이션 바 -->
      <footer class="card-bottom-bar">
        <button class="card-nav-btn" id="btn-prev" title="이전 구절">
          <span class="nav-arrow">◀</span>
          <span class="nav-txt">
            <span class="txt-long">이전 구절</span>
            <span class="txt-short">이전</span>
          </span>
        </button>
        <button class="card-reveal-btn" id="btn-reveal" title="정답 확인 / 다시 가리기">📖 전체 보기</button>
        <button class="card-nav-btn" id="btn-next" title="다음 구절">
          <span class="nav-txt">
            <span class="txt-long">다음 구절</span>
            <span class="txt-short">다음</span>
          </span>
          <span class="nav-arrow">▶</span>
        </button>
      </footer>
    </div>

    <!-- JS: 의존 순서대로 로드 -->
    <script src="js/masking.js"></script>
    <script src="js/store.js"></script>
    <script src="js/card.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
          reg.update();
          if (reg.waiting) reg.waiting.postMessage('skip-waiting');
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed') sw.postMessage('skip-waiting');
            });
          });
        });
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data === 'sw-updated') window.location.reload();
        });
      }
    </script>
  </body>
</html>
